# Findings that were reviewed and accepted as they are.
#
# A waiver matches findings by check id, subject and (optionally) key; subject
# and key may use shell wildcards (* ? [abc]). Waived findings still appear in
# the report, with the reason, but do not fail the run. A waiver that no longer
# matches anything is reported as stale so this file stays honest.
#
# Disagreements with the GiellaLT oracle are settled in
# tools/morph-oracle/adjudicated.json (base forms) and in the "known oracle
# defects" of morphology-audit.py (possessives), not here.
#
# [[waiver]]
# check    = "S07"                    # check id
# subject  = "sentence:n.67"          # exact or wildcard: "sentence:c.par.*"
# key      = "Odota>hetki"            # optional; omit to waive every finding of the check on the subject
# reason   = "Why this is correct."   # required
# reviewed = "2026-10-05"             # when, and ideally by whom

